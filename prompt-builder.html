<title>Дело беглецов</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

<style>
  :root {
    --bg:#050a14; --surface:#0b1628; --surface2:#0f1f3a;
    --accent:#6366f1; --accent-dim:rgba(99,102,241,.12); --accent-border:rgba(99,102,241,.28);
    --violet:#a78bfa; --cyan:#22d3ee; --success:#10b981; --danger:#f87171;
    --text:#e2e8f0; --text-muted:#7e96b5; --text-dim:#3d5270;
    --border:rgba(99,102,241,.18); --border-hi:rgba(99,102,241,.42);
    --r:14px; --rs:8px;
    --font:'Nunito',system-ui,sans-serif;
    --mono:'JetBrains Mono',monospace;
  }
  @media(prefers-color-scheme:light){
    :root:not([data-theme="dark"]){
      --bg:#f0f4ff; --surface:#fff; --surface2:#eef2fc;
      --accent:#4f46e5; --accent-dim:rgba(79,70,229,.08); --accent-border:rgba(79,70,229,.2);
      --violet:#7c3aed; --text:#1e293b; --text-muted:#5a6d8a; --text-dim:#9eafc5;
      --border:rgba(79,70,229,.15); --border-hi:rgba(79,70,229,.38);
    }
  }
  :root[data-theme="dark"]{--bg:#050a14;--surface:#0b1628;--surface2:#0f1f3a;--text:#e2e8f0;--text-muted:#7e96b5}

  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:64px}

  body::before{
    content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
    background-image:
      radial-gradient(1px 1px at 8% 12%,rgba(255,255,255,.45) 0%,transparent 100%),
      radial-gradient(1.5px 1.5px at 48% 7%,rgba(255,255,255,.3) 0%,transparent 100%),
      radial-gradient(1px 1px at 78% 18%,rgba(255,255,255,.35) 0%,transparent 100%),
      radial-gradient(1px 1px at 25% 55%,rgba(255,255,255,.2) 0%,transparent 100%),
      radial-gradient(1.5px 1.5px at 62% 40%,rgba(167,139,250,.35) 0%,transparent 100%),
      radial-gradient(1px 1px at 90% 62%,rgba(255,255,255,.25) 0%,transparent 100%),
      radial-gradient(1px 1px at 14% 80%,rgba(255,255,255,.2) 0%,transparent 100%),
      radial-gradient(1px 1px at 70% 78%,rgba(255,255,255,.15) 0%,transparent 100%);
  }
  @media(prefers-color-scheme:light){:root:not([data-theme="dark"]) body::before{display:none}}

  .wrap{position:relative;max-width:700px;margin:0 auto;padding:0 16px;z-index:1}

  /* lang bar */
  .lang-bar{
    position:sticky;top:env(safe-area-inset-top,0px);z-index:100;
    background:var(--bg);border-bottom:1px solid var(--border);
    padding:10px 16px;display:flex;gap:6px;flex-wrap:wrap;justify-content:center;
  }
  .lb{padding:4px 14px;border-radius:20px;border:1px solid var(--border);background:none;
    color:var(--text-muted);font-family:var(--font);font-size:13px;font-weight:700;cursor:pointer;transition:all .18s;letter-spacing:.03em}
  .lb:hover{border-color:var(--violet);color:var(--violet)}
  .lb.on{background:var(--accent);border-color:var(--accent);color:#fff}

  /* header */
  .header{text-align:center;padding:36px 0 28px}
  .header-ship{display:block;margin:0 auto 14px;width:60px;height:60px}
  .header-badge{
    display:inline-flex;align-items:center;gap:7px;
    font-size:11px;font-weight:700;letter-spacing:.12em;color:var(--cyan);
    text-transform:uppercase;margin-bottom:14px;
    border:1px solid rgba(34,211,238,.3);border-radius:20px;padding:4px 14px;
  }
  .header-badge .dot{width:6px;height:6px;border-radius:50%;background:var(--cyan);
    box-shadow:0 0 6px var(--cyan);animation:blink 1.4s ease-in-out infinite}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
  .header h1{
    font-size:clamp(26px,6vw,38px);font-weight:900;
    background:linear-gradient(135deg,#818cf8 0%,#c4b5fd 50%,#67e8f9 100%);
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
    margin-bottom:10px;text-wrap:balance;
  }
  .narrative{
    font-size:14px;color:var(--text-muted);line-height:1.65;
    max-width:480px;margin:0 auto;
    background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
    padding:14px 18px;
  }

  /* section */
  .sec{margin-top:36px}
  .sec-head{display:flex;align-items:center;gap:10px;margin-bottom:16px}
  .step{width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;
    font-size:13px;font-weight:900;display:flex;align-items:center;justify-content:center;
    flex-shrink:0;box-shadow:0 0 14px rgba(99,102,241,.5)}
  .sec-title{font-size:19px;font-weight:900;color:var(--text);flex:1}
  .sec-hint{font-size:13px;color:var(--text-muted);margin-bottom:14px;line-height:1.5}

  /* creatures grid */
  .clist{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  @media(max-width:560px){.clist{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:360px){.clist{grid-template-columns:1fr}}

  /* open card */
  .cc{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
    padding:14px;animation:slideIn .22s ease;transition:border-color .2s}
  .cc:focus-within{border-color:var(--border-hi)}
  @keyframes slideIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
  .cc-head{display:flex;align-items:center;gap:7px;margin-bottom:11px}
  .cnum{width:24px;height:24px;border-radius:7px;background:var(--accent-dim);
    border:1px solid var(--accent-border);color:var(--violet);
    font-size:11px;font-weight:900;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .clabel{font-size:12px;font-weight:700;color:var(--text-muted);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rm-btn{background:none;border:none;color:var(--text-dim);cursor:pointer;
    font-size:15px;padding:2px 5px;border-radius:5px;transition:color .18s;line-height:1;flex-shrink:0}
  .rm-btn:hover{color:var(--danger)}

  /* fields — always single column inside narrow grid cards */
  .fields{display:flex;flex-direction:column;gap:9px}
  .fg{display:flex;flex-direction:column;gap:4px}
  .fg label{font-size:10px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.07em}
  .fg input[type=text]{
    background:var(--surface2);border:1px solid var(--border);border-radius:var(--rs);
    padding:8px 10px;color:var(--text);font-family:var(--font);font-size:13px;font-weight:600;
    transition:border-color .18s;width:100%;
  }
  .fg input[type=text]:focus{outline:none;border-color:var(--border-hi)}
  .fg input[type=text]::placeholder{color:var(--text-dim)}
  .file-wrap{display:flex;align-items:center;background:var(--surface2);
    border:1px solid var(--border);border-radius:var(--rs);overflow:hidden;transition:border-color .18s}
  .file-wrap:focus-within{border-color:var(--border-hi)}
  .file-wrap input{background:none;border:none;flex:1;padding:8px 10px;
    color:var(--text);font-family:var(--mono);font-size:12px;min-width:0}
  .file-wrap input:focus{outline:none}
  .file-wrap input::placeholder{color:var(--text-dim);font-family:var(--mono)}
  .file-ext{padding:8px 10px 8px 0;color:var(--violet);font-family:var(--mono);font-size:12px;flex-shrink:0}

  /* closed/locked card slot */
  .cc-closed{
    background:var(--surface);border:2px dashed var(--border);border-radius:var(--r);
    min-height:110px;display:flex;align-items:center;justify-content:center;
    cursor:pointer;transition:all .2s;animation:slideIn .22s ease;
  }
  .cc-closed:hover{border-color:var(--violet);background:var(--accent-dim)}
  .cc-closed:hover .cc-plus-ring{border-color:var(--violet);background:rgba(167,139,250,.18)}
  .cc-plus-ring{
    width:42px;height:42px;border-radius:50%;
    border:2px solid var(--border);background:var(--surface2);
    display:flex;align-items:center;justify-content:center;
    transition:all .2s;
  }
  .cc-plus-icon{color:var(--text-dim);font-size:22px;line-height:1;transition:color .2s;user-select:none}
  .cc-closed:hover .cc-plus-icon{color:var(--violet)}

  /* add button — bright */
  .add-btn{
    width:100%;margin-top:14px;padding:15px;
    background:var(--accent);border:none;border-radius:var(--r);
    color:#fff;font-family:var(--font);font-size:16px;font-weight:800;
    cursor:pointer;transition:background .18s,transform .12s;letter-spacing:.02em;
  }
  .add-btn:hover:not(:disabled){background:#4f46e5}
  .add-btn:active:not(:disabled){transform:scale(.99)}
  .add-btn:disabled{opacity:.4;cursor:not-allowed;background:var(--surface2);color:var(--text-muted)}

  /* background presets */
  .bg-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
  @media(max-width:420px){.bg-grid{grid-template-columns:repeat(2,1fr)}}
  .bp{background:var(--surface);border:2px solid var(--border);border-radius:var(--r);
    padding:12px 8px 10px;text-align:center;cursor:pointer;transition:all .18s}
  .bp:hover{border-color:var(--violet);background:var(--accent-dim)}
  .bp.on{border-color:var(--accent);background:var(--accent-dim)}
  .bp-img{display:block;width:100%;max-width:96px;margin:0 auto 8px;border-radius:6px;overflow:hidden}
  .bp-img svg{display:block;width:100%;height:auto}
  .bp-label{font-size:12px;font-weight:700;color:var(--text-muted)}
  .bg-extra{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
  .bg-extra textarea{width:100%;background:none;border:none;
    padding:13px 15px;color:var(--text);font-family:var(--font);
    font-size:14px;font-weight:600;resize:vertical;min-height:72px;display:block}
  .bg-extra textarea:focus{outline:none}
  .bg-extra textarea::placeholder{color:var(--text-dim)}

  /* prompt output */
  .prompt-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
  .prompt-bar{
    display:flex;align-items:center;
    padding:10px 14px;border-bottom:1px solid var(--border);gap:8px;
  }
  .dots{display:flex;gap:5px;flex-shrink:0}
  .dot-r{width:9px;height:9px;border-radius:50%;background:#f87171}
  .dot-y{width:9px;height:9px;border-radius:50%;background:#fbbf24}
  .dot-g{width:9px;height:9px;border-radius:50%;background:#34d399}
  .prompt-bar-lbl{font-size:11px;font-weight:700;color:var(--text-muted);
    text-transform:uppercase;letter-spacing:.07em;flex:1}

  /* reset button — shown only when user edited manually */
  .reset-btn{
    display:none;align-items:center;gap:5px;
    background:none;border:1px solid var(--border);border-radius:20px;
    color:var(--text-muted);font-family:var(--font);font-size:11px;font-weight:700;
    padding:3px 10px;cursor:pointer;transition:all .18s;white-space:nowrap;flex-shrink:0;
  }
  .reset-btn:hover{border-color:var(--accent);color:var(--accent)}
  .reset-btn.show{display:flex}

  /* editable prompt textarea */
  .prompt-body{
    display:block;width:100%;
    padding:16px;
    font-family:var(--mono);font-size:13px;line-height:1.75;
    color:var(--text);background:none;border:none;
    resize:vertical;min-height:200px;
    white-space:pre;word-break:break-word;
  }
  .prompt-body:focus{outline:none}
  .prompt-body.empty{color:var(--text-dim);font-style:italic}

  .copy-btn{
    display:flex;align-items:center;justify-content:center;gap:9px;
    width:100%;margin-top:12px;padding:16px;
    background:var(--accent);border:none;border-radius:var(--r);
    color:#fff;font-family:var(--font);font-size:17px;font-weight:900;
    cursor:pointer;transition:background .2s,transform .15s;letter-spacing:.01em;
  }
  .copy-btn:hover{background:#4f46e5}
  .copy-btn:active{transform:scale(.98)}
  .copy-btn.ok{background:var(--success);transform:scale(1.015)}
  .copy-icon{display:flex;align-items:center;flex-shrink:0}

  /* RTL */
  [dir="rtl"] .sec-head,[dir="rtl"] .cc-head{flex-direction:row-reverse}
  [dir="rtl"] .prompt-bar{flex-direction:row-reverse}
  [dir="rtl"] .prompt-bar-lbl{text-align:left}
  [dir="rtl"] .prompt-body{direction:rtl;text-align:right}
  [dir="rtl"] .file-ext{padding:9px 0 9px 12px}
  [dir="rtl"] .file-wrap input{padding:9px 12px}

  @media(prefers-reduced-motion:reduce){.cc{animation:none}.header-badge .dot{animation:none}}
</style>

<div class="lang-bar" id="langBar"></div>

<div class="wrap">
  <header class="header">
    <svg class="header-ship" viewBox="0 0 60 60" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <ellipse cx="30" cy="48" rx="12" ry="5" fill="#6366f1" opacity=".3"/>
      <ellipse cx="30" cy="50" rx="6" ry="3" fill="#22d3ee" opacity=".45"/>
      <path d="M15 34 L2 43 L15 41Z" fill="#4338ca"/>
      <path d="M45 34 L58 43 L45 41Z" fill="#4338ca"/>
      <ellipse cx="30" cy="27" rx="15" ry="11" fill="#6366f1"/>
      <path d="M23 23 L30 8 L37 23Z" fill="#818cf8"/>
      <ellipse cx="30" cy="24" rx="9" ry="7" fill="#4f46e5"/>
      <ellipse cx="29" cy="22" rx="5.5" ry="4.5" fill="#22d3ee" opacity=".45"/>
      <ellipse cx="28" cy="21" rx="3" ry="2.5" fill="#e0f2fe" opacity=".35"/>
      <rect x="22" y="38" width="6" height="6" rx="2" fill="#4338ca"/>
      <rect x="32" y="38" width="6" height="6" rx="2" fill="#4338ca"/>
    </svg>
    <div class="header-badge"><span class="dot"></span><span id="hBadge"></span></div>
    <h1 id="hTitle"></h1>
    <p class="narrative" id="hNarr"></p>
  </header>

  <section class="sec">
    <div class="sec-head"><div class="step">1</div><h2 class="sec-title" id="s1Title"></h2></div>
    <p class="sec-hint" id="s1Hint"></p>
    <div class="clist" id="cList"></div>
    <button class="add-btn" id="addBtn" onclick="addC()"></button>
  </section>

  <section class="sec">
    <div class="sec-head"><div class="step">2</div><h2 class="sec-title" id="s2Title"></h2></div>
    <p class="sec-hint" id="s2Hint"></p>
    <div class="bg-grid" id="bgGrid"></div>
    <div class="bg-extra" id="bgExtra" style="display:none">
      <textarea id="bgTxt" rows="3" oninput="go()"></textarea>
    </div>
  </section>

  <section class="sec">
    <div class="sec-head"><div class="step">3</div><h2 class="sec-title" id="s3Title"></h2></div>
    <div class="prompt-box">
      <div class="prompt-bar">
        <div class="dots"><div class="dot-r"></div><div class="dot-y"></div><div class="dot-g"></div></div>
        <span class="prompt-bar-lbl" id="s3Hint"></span>
        <button class="reset-btn" id="resetBtn" onclick="resetPrompt()">
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
            <path d="M10.5 2A5 5 0 1 0 11 6"/>
            <path d="M9 0 L11 2 L9 4"/>
          </svg>
          <span id="resetTxt"></span>
        </button>
      </div>
      <textarea class="prompt-body" id="promptBody" spellcheck="false"></textarea>
    </div>
    <button class="copy-btn" id="copyBtn" onclick="doCopy()">
      <span class="copy-icon" id="copyIcon">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="white" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <rect x="7" y="7" width="10" height="12" rx="2"/>
          <path d="M13 7V5a2 2 0 00-2-2H5a2 2 0 00-2 2v9a2 2 0 002 2h2"/>
        </svg>
      </span>
      <span id="copyTxt"></span>
    </button>
  </section>
</div>

// ── Transliterator ─────────────────────────────────────────────
function slug(s){
  const m={'а':'a','б':'b','в':'v','г':'g','д':'d','е':'e','ё':'yo','ж':'zh','з':'z','и':'i','й':'y','к':'k','л':'l','м':'m','н':'n','о':'o','п':'p','р':'r','с':'s','т':'t','у':'u','ф':'f','х':'kh','ц':'ts','ч':'ch','ш':'sh','щ':'shch','ъ':'','ы':'y','ь':'','э':'e','ю':'yu','я':'ya',' ':'_','-':'_'};
  return(s||'').toLowerCase().split('').map(c=>m[c]??(/[a-z0-9]/.test(c)?c:'')).join('').replace(/_{2,}/g,'_').replace(/^_|_$/g,'')||'creature';
}
function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

const LANG_ORDER=['RU','EN','ES','ID','IT','TR','PL','PT','AR'];

// ── State ──────────────────────────────────────────────────────
const INIT_SLOTS=5;
function makeSlot(open=false){return{n:'',t:'',f:'',auto:true,open};}
let st={
  lang:'RU',
  creatures:Array.from({length:INIT_SLOTS},(_,i)=>makeSlot(i===0)),
  bg:'stars',custText:''
};
let userEdited=false;

// ── Lang ───────────────────────────────────────────────────────
function setLang(l){
  st.lang=l;
  document.documentElement.lang=T[l].lang;
  document.documentElement.dir=T[l].dir;
  renderAll();
}

// ── Render all ─────────────────────────────────────────────────
function renderAll(){
  const t=T[st.lang];
  document.getElementById('langBar').innerHTML=
    LANG_ORDER.map(l=>`<button class="lb${l===st.lang?' on':''}" onclick="setLang('${l}')">${l}</button>`).join('');
  document.getElementById('hBadge').textContent=t.badge;
  document.getElementById('hTitle').textContent=t.title;
  document.getElementById('hNarr').textContent=t.narr;
  document.getElementById('s1Title').textContent=t.s1;
  document.getElementById('s1Hint').textContent=t.s1h;
  document.getElementById('s2Title').textContent=t.s2;
  document.getElementById('s2Hint').textContent=t.s2h;
  document.getElementById('s3Title').textContent=t.s3;
  document.getElementById('s3Hint').textContent=t.s3h;
  document.getElementById('copyTxt').textContent=t.copy;
  document.getElementById('resetTxt').textContent=t.reset;
  renderCreatures();renderBg();go();
}

function renderCreatures(){
  const t=T[st.lang];
  document.getElementById('cList').innerHTML=st.creatures.map((c,i)=>{
    const num=i+1;
    if(!c.open){
      return`<button class="cc-closed" onclick="openC(${i})" aria-label="${esc(t.cLbl(num))}">
        <div class="cc-plus-ring"><span class="cc-plus-icon">+</span></div>
      </button>`;
    }
    const canClose=st.creatures.filter(x=>x.open).length>1||i>=INIT_SLOTS;
    return`<div class="cc">
      <div class="cc-head">
        <div class="cnum">${num}</div>
        <div class="clabel">${t.cLbl(num)}</div>
        ${canClose||i>=INIT_SLOTS?`<button class="rm-btn" onclick="closeC(${i})" title="&#10005;">&#10005;</button>`:''}
      </div>
      <div class="fields">
        <div class="fg"><label>${t.nameLbl}</label>
          <input type="text" placeholder="${esc(t.namePh)}" value="${esc(c.n)}" oninput="upC(${i},'n',this.value)"></div>
        <div class="fg"><label>${t.traitLbl}</label>
          <input type="text" placeholder="${esc(t.traitPh)}" value="${esc(c.t)}" oninput="upC(${i},'t',this.value)"></div>
        <div class="fg"><label>${t.fileLbl}</label>
          <div class="file-wrap">
            <input type="text" id="fi${i}" placeholder="${esc(t.filePh)}" value="${esc(c.f)}" oninput="upFile(${i},this.value)">
            <span class="file-ext">.png</span>
          </div></div>
      </div>
    </div>`;
  }).join('');
  const ab=document.getElementById('addBtn');
  ab.textContent=t.addBtn;
  ab.disabled=false; // always allow adding beyond 5
}

function renderBg(){
  const t=T[st.lang];
  document.getElementById('bgGrid').innerHTML=BG_IDS.map((id,i)=>`
    <button class="bp${st.bg===id?' on':''}" onclick="setBg('${id}')">
      <span class="bp-img">${BG_SVG[id]}</span>
      <span class="bp-label">${esc(t.bgs[i].l)}</span>
    </button>`).join('');
  const ex=document.getElementById('bgExtra');
  if(st.bg==='custom'){
    ex.style.display='block';
    const ta=ex.querySelector('textarea');
    ta.placeholder=T[st.lang].custPh;ta.value=st.custText;
  }else{ex.style.display='none';}
}

// ── Handlers ───────────────────────────────────────────────────
function upC(i,k,v){
  st.creatures[i][k]=v;
  if(k==='n'&&st.creatures[i].auto){
    const s=slug(v);st.creatures[i].f=s;
    const el=document.getElementById(`fi${i}`);if(el)el.value=s;
  }
  userEdited=false;showReset(false);go();
}
function upFile(i,v){st.creatures[i].f=v;st.creatures[i].auto=false;go();}

function openC(i){st.creatures[i].open=true;renderCreatures();}

function closeC(i){
  if(i>=INIT_SLOTS){
    // extra cards — remove entirely
    st.creatures.splice(i,1);
  }else{
    // original 5 — reset & close
    st.creatures[i]=makeSlot(false);
  }
  renderCreatures();go();
}

function addC(){
  st.creatures.push(makeSlot(true));
  renderCreatures();
  // scroll new card into view
  setTimeout(()=>{
    const cards=document.querySelectorAll('#cList > *');
    if(cards.length)cards[cards.length-1].scrollIntoView({behavior:'smooth',block:'nearest'});
  },80);
}

function setBg(id){st.bg=id;renderBg();userEdited=false;showReset(false);go();}

// ── Prompt generation ──────────────────────────────────────────
function go(){
  if(st.bg==='custom'){const ta=document.querySelector('#bgExtra textarea');if(ta)st.custText=ta.value;}
  if(userEdited)return; // don't overwrite manual edits
  const t=T[st.lang];
  const valid=st.creatures.filter(c=>c.n.trim());
  const body=document.getElementById('promptBody');
  if(!valid.length){
    body.value=t.empty;body.classList.add('empty');return;
  }
  body.classList.remove('empty');
  const bgDesc=st.bg==='custom'
    ?(st.custText.trim()||'...')
    :(t.bgs[BG_IDS.indexOf(st.bg)]?.d||'');
  const cs=st.creatures.map(c=>({...c,f:c.f.trim()||slug(c.n)}));
  body.value=t.prompt(cs,bgDesc);
}

function showReset(show){
  const btn=document.getElementById('resetBtn');
  btn.classList.toggle('show',show);
}

function resetPrompt(){
  userEdited=false;showReset(false);go();
}

// ── Copy ───────────────────────────────────────────────────────
const ICON_CLIP=`<svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="white" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="7" width="10" height="12" rx="2"/><path d="M13 7V5a2 2 0 00-2-2H5a2 2 0 00-2 2v9a2 2 0 002 2h2"/></svg>`;
const ICON_CHECK=`<svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10l5 5 9-9"/></svg>`;

function doCopy(){
  const body=document.getElementById('promptBody');
  const txt=body.value;
  const t=T[st.lang];
  if(!txt||txt===t.empty)return;
  navigator.clipboard.writeText(txt).then(()=>{
    const btn=document.getElementById('copyBtn');
    const icon=document.getElementById('copyIcon');
    const lbl=document.getElementById('copyTxt');
    btn.classList.add('ok');icon.innerHTML=ICON_CHECK;lbl.textContent=t.copied;
    setTimeout(()=>{btn.classList.remove('ok');icon.innerHTML=ICON_CLIP;lbl.textContent=t.copy;},2200);
  });
}

// ── Manual edit listener ───────────────────────────────────────
document.getElementById('promptBody').addEventListener('input',()=>{
  userEdited=true;showReset(true);
  document.getElementById('promptBody').classList.remove('empty');
});

document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='Enter')doCopy();});

renderAll();
</script>
